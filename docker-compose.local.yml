# Uso local (Windows/Mac com Docker Desktop) para mostrar o sistema a um
# colega na mesma rede, sem tocar no docker-compose.yml de producao.
#
# O docker-compose.yml usa network_mode: host, que so funciona em host
# Linux de verdade (o servidor 192.168.12.74). No Docker Desktop
# (Windows/Mac) o container roda dentro de uma VM interna, entao "host"
# la dentro NAO e a rede da sua maquina - por isso o container sobe e o
# gunicorn escuta, mas ninguem de fora consegue acessar. Aqui a gente usa
# rede padrao do Docker com "ports:", que funciona em qualquer SO e
# publica a porta 5000 de verdade na sua maquina.
#
# Uso:
#   docker compose -f docker-compose.local.yml up -d --build
#   (depois) docker compose -f docker-compose.local.yml down
#
# Acesse em http://localhost:5000 (nesta maquina) ou
# http://<IP desta maquina>:5000 (outro computador na mesma rede).
services:
  anatel:
    build: .
    image: anatel-certificacao:local
    container_name: anatel-certificacao-local

    ports:
      - "5000:5000"

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./instance:/app/instance

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
